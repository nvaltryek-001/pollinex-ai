# Render blueprint (backend + PostgreSQL). Frontend: deploy frontend/ to Vercel with VITE_API_URL set to the Render URL.
services:
  - type: web
    name: pollinex-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: POLLINEX_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: pollinex-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # e.g. https://pollinex.vercel.app
    disk:
      name: storage
      mountPath: /srv/pollinex/backend/storage
      sizeGB: 1
databases:
  - name: pollinex-db
    plan: free
