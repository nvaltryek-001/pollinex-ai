name: Wikimedia Commons flower photos
# Downloads openly licensed flower photos of the target crops from Wikimedia Commons flower categories (unreachable from
# the build workspace), verifies them (licence per file, decode, duplicates vs. all other sources, author-grouped splits)
# and commits the processed set + reports back.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: { contents: write }

jobs:
  commons:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[commons]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pillow
      - name: Download + verify
        run: python datasets/scripts/download_commons_flowers.py --max 200
      - name: Inventory
        run: pip install -q -r backend/requirements.txt -c backend/requirements.lock.txt && python datasets/scripts/audit_datasets.py
      - name: Commit back
        run: |
          git config user.name "pollinex-ci"; git config user.email "pollinex-ci@users.noreply.github.com"
          git add -f datasets/processed/commons_flowers datasets/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Datasets: Wikimedia Commons flower photos from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
