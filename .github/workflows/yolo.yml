name: YOLO11 detector (CPU training)
# Trains a YOLO11n CANDIDATE on every committed box-annotated set (USDA apple/peach/pear + TF sunflower subset; one class
# "flower"; each source keeps its own split), checks ONNX vs PyTorch consistency, and applies the pre-registered,
# validation-only selection rule (ai-engine/training/yolo_select_rule.py) against the deployed model. Test results are
# reported for the model that ends up deployed. Checkpoints are kept as a workflow artifact; the candidate ONNX is committed.
on:
  workflow_dispatch:
    inputs:
      hours: { description: "max training hours", required: false, default: "4.8" }
      imgsz: { description: "image size", required: false, default: "960" }
  push:
    branches: [main]

permissions: { contents: write }

jobs:
  yolo:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[yolo]')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HOURS: ${{ github.event.inputs.hours || '4.8' }}
      IMGSZ: ${{ github.event.inputs.imgsz || '960' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -c backend/requirements.lock.txt
          pip install "ultralytics>=8.3" onnx onnxslim
      - name: Train candidate + export
        run: python ai-engine/training/train_yolo11.py --combined --imgsz $IMGSZ --time $HOURS --epochs 200 --batch 16 --device cpu --report-name yolo11_candidate_evaluation
      - name: ONNX vs PyTorch consistency
        continue-on-error: true
        run: python ai-engine/training/yolo_onnx_consistency.py
      - name: Validation analysis (deployed + candidate)
        run: |
          python ai-engine/training/detector_analysis.py --detector onnx:ai-engine/models/flower_yolo11n.onnx --split val --tag yolo11
          python ai-engine/training/detector_analysis.py --detector onnx:ai-engine/runs/export/flower_yolo11n.onnx --split val --tag candidate
      - name: Selection rule (validation only)
        run: python ai-engine/training/yolo_select_rule.py
      - name: Test report for the deployed model (+ candidate for reference)
        run: |
          python ai-engine/training/detector_analysis.py --detector onnx:ai-engine/models/flower_yolo11n.onnx --split val --tag yolo11
          python ai-engine/training/detector_analysis.py --detector onnx:ai-engine/models/flower_yolo11n.onnx --split test --threshold-from val --tag yolo11
          python ai-engine/training/detector_analysis.py --detector onnx:ai-engine/runs/export/flower_yolo11n.onnx --split test --threshold-from val --tag candidate
      - name: Preserve checkpoints + candidate (workflow artifact, 30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo11-run-${{ github.run_id }}
          path: |
            ai-engine/runs/flower_yolo11/weights/*.pt
            ai-engine/runs/flower_yolo11/results.csv
            ai-engine/runs/flower_yolo11/args.yaml
            ai-engine/runs/export/
          retention-days: 30
          if-no-files-found: warn
      - name: Keep candidate ONNX in the repo
        if: always()
        run: |
          if [ -f ai-engine/runs/export/flower_yolo11n.onnx ]; then
            mkdir -p ai-engine/models/candidates && cp ai-engine/runs/export/flower_yolo11n.onnx ai-engine/models/candidates/flower_yolo11n_${IMGSZ}_${{ github.run_id }}.onnx
            cp ai-engine/runs/export/flower_yolo11n.json ai-engine/models/candidates/flower_yolo11n_${IMGSZ}_${{ github.run_id }}.json
          fi
      - name: Commit back
        if: always()
        run: |
          git config user.name "pollinex-ci"; git config user.email "pollinex-ci@users.noreply.github.com"
          git add ai-engine/reports
          git add -f ai-engine/models/flower_yolo11n.onnx ai-engine/models/flower_yolo11n.json || true
          [ -d ai-engine/models/candidates ] && git add -f ai-engine/models/candidates || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "YOLO11: candidate training + validation selection from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
