name: iNaturalist flowering photos
# Downloads species-verified, CC0/CC-BY flowering photos from iNaturalist (unreachable from the build workspace),
# verifies them (decode, duplicates, observer-grouped splits) and commits the processed set + reports back.
on:
  workflow_dispatch:
    inputs:
      per_species: { description: "images per species", required: false, default: "200" }
  push:
    branches: [main]

permissions: { contents: write }

jobs:
  inat:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[inat]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pillow
      - name: Download + verify
        run: python datasets/scripts/download_inat_flowering.py --per-species ${{ github.event.inputs.per_species || '200' }}
      - name: Inventory
        run: pip install -q -r backend/requirements.txt -c backend/requirements.lock.txt && python datasets/scripts/audit_datasets.py
      - name: Commit back
        run: |
          git config user.name "pollinex-ci"; git config user.email "pollinex-ci@users.noreply.github.com"
          git add -f datasets/processed/inat_flowering datasets/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Datasets: iNaturalist flowering photos from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
