name: Research papers (OpenAlex)
# Builds the verified paper list via OpenAlex and downloads ONLY Creative-Commons / public-domain open-access PDFs.
# Manifest -> main (research/papers/); PDFs -> separate branch `research-papers` so main stays small.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: { contents: write }
jobs:
  papers:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[papers]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research/scripts/collect_papers.py --out research/papers --pdf-dir ${{ runner.temp }}/papers_pdf
      - name: Commit manifest to main
        run: |
          git config user.name "pollinex-ci"; git config user.email "pollinex-ci@users.noreply.github.com"
          git add research/papers
          git diff --cached --quiet || git commit -m "Research: verified paper manifest (OpenAlex) from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Push open-access PDFs to branch research-papers
        run: |
          cp research/papers/papers_manifest.* ${{ runner.temp }}/papers_pdf/
          cd ${{ runner.temp }}/papers_pdf
          git init -q -b research-papers && git config user.name "pollinex-ci" && git config user.email "pollinex-ci@users.noreply.github.com"
          printf "Open-access (Creative Commons / public domain) PDFs listed in papers_manifest.csv. Each PDF keeps its own licence;\nsee the licence column and cite the original publication.\n" > README.txt
          git add -A && git commit -qm "Open-access PDFs from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-papers
